<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630" role="img" aria-label="ReadmeCraft - GitHub README Studio">
  <!-- Deep obsidian background -->
  <rect width="1200" height="630" fill="#090d16"/>
  <!-- Subtle grid pattern -->
  <defs>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#1e293b" stroke-width="0.5" opacity="0.3"/>
    </pattern>
    <filter id="textGlow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feFlood flood-color="#10b981" result="color"/>
      <feComposite in="color" in2="blur" operator="in" result="glow"/>
      <feMerge>
        <feMergeNode in="glow"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  <rect width="1200" height="630" fill="url(#grid)"/>
  
  <!-- Accent line -->
  <line x1="120" y1="280" x2="1080" y2="280" stroke="#1e293b" stroke-width="1" stroke-dasharray="8,12"/>
  
  <!-- Main logo mark -->
  <g transform="translate(140, 200)">
    <rect width="120" height="120" rx="16" fill="#0b101c" stroke="#1e293b" stroke-width="2"/>
    <g transform="translate(60, 60)">
      <path d="M -22 0 L -8 -11 L -8 11 Z" fill="#10b981" opacity="0.95"/>
      <path d="M -2 -2 L 0 6 L 2 -2 Z" fill="#10b981"/>
      <path d="M 22 0 L 8 -11 L 8 11 Z" fill="#10b981" opacity="0.95"/>
    </g>
  </g>

  <!-- Typography -->
  <text x="300" y="255" font-family="'Space Grotesk', 'Segoe UI', sans-serif" font-weight="700" font-size="56" fill="#f1f5f9" letter-spacing="-1">
    <tspan fill="#10b981">Readme</tspan><tspan fill="#94a3b8">Craft</tspan>
  </text>
  
  <text x="300" y="315" font-family="'JetBrains Mono', monospace" font-size="16" fill="#64748b" letter-spacing="3" text-transform="uppercase">
    GitHub README Studio
  </text>

  <!-- Feature tags -->
  <g font-family="'JetBrains Mono', monospace" font-size="13" fill="#94a3b8">
    <g transform="translate(300, 370)">
      <rect x="0" y="-18" width="180" height="32" rx="6" fill="#0b101c" stroke="#1e293b" stroke-width="1"/>
      <text x="90" y="3" text-anchor="middle" fill="#10b981">Dual-Mode</text>
    </g>
    <g transform="translate(500, 370)">
      <rect x="0" y="-18" width="200" height="32" rx="6" fill="#0b101c" stroke="#1e293b" stroke-width="1"/>
      <text x="100" y="3" text-anchor="middle" fill="#10b981">Bento + Minimalist</text>
    </g>
    <g transform="translate(720, 370)">
      <rect x="0" y="-18" width="160" height="32" rx="6" fill="#0b101c" stroke="#1e293b" stroke-width="1"/>
      <text x="80" y="3" text-anchor="middle" fill="#10b981">Live Preview</text>
    </g>
    <g transform="translate(900, 370)">
      <rect x="0" y="-18" width="180" height="32" rx="6" fill="#0b101c" stroke="#1e293b" stroke-width="1"/>
      <text x="90" y="3" text-anchor="middle" fill="#10b981">Export Ready</text>
    </g>
  </g>

  <!-- Ecosystem badges -->
  <g font-family="'JetBrains Mono', monospace" font-size="11" fill="#64748b" transform="translate(300, 440)">
    <text x="0" y="0">Ecosystem:</text>
    <g transform="translate(120, -4)">
      <circle cx="0" cy="6" r="6" fill="#10b981" opacity="0.2"/>
      <text x="18" y="10" fill="#10b981">GitHolo</text>
      <text x="18" y="24" fill="#64748b" font-size="10">githolo.bharatdn.com</text>
    </g>
    <g transform="translate(320, -4)">
      <circle cx="0" cy="6" r="6" fill="#f59e0b" opacity="0.2"/>
      <text x="18" y="10" fill="#f59e0b">GitChronicle</text>
      <text x="18" y="24" fill="#64748b" font-size="10">gitchronicle.bharatdn.com</text>
    </g>
  </g>

  <!-- Domain badge -->
  <g transform="translate(300, 520)">
    <rect x="0" y="-16" width="280" height="40" rx="8" fill="#0b101c" stroke="#10b981" stroke-width="2"/>
    <text x="140" y="6" text-anchor="middle" font-family="'Space Grotesk', sans-serif" font-weight="600" font-size="16" fill="#10b981">
      readme.bharatdn.com
    </text>
  </g>

  <!-- Author -->
  <text x="1080" y="600" text-anchor="end" font-family="'JetBrains Mono', monospace" font-size="11" fill="#334155">
    Built by ErBharatMalhotra
  </text>
</svg>